name: ci

on:
  push:
    branches: [main]
    # A release: v1.1.0 publishes the image as 1.1.0, 1.1 and 1, which the compose files pull.
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  # Pinned by digest, like the base images; bump deliberately.
  TRIVY_IMAGE: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prettier-check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Secret scan of the repository
        run: >
          docker run --rm -v "$PWD:/repository:ro" -w /repository "$TRIVY_IMAGE"
          fs --quiet --scanners secret --skip-dirs node_modules,test/fixtures --exit-code 1 .

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Image name (GHCR wants lower case), the tags to push, and what new runners should run
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/autoheal"
          major="$(node -p "require('./package.json').version.split('.')[0]")"
          tags="$image:$GITHUB_SHA"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            tags="$tags,$image:main,$image:latest"
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            tags="$tags,$image:$version,$image:${version%.*},$image:${version%%.*}"
          fi
          {
            echo "IMAGE=$image"
            echo "TAGS=$tags"
            echo "RUNNER_IMAGE=$image:$major"
          } >> "$GITHUB_ENV"
      - name: Build for scanning and smoke tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: autoheal:ci
          build-args: AUTOHEAL_IMAGE=${{ env.RUNNER_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Vulnerability and secret scan
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE"
          image --quiet --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 autoheal:ci
      - name: Smoke test
        run: test/fixtures/tls/generate.sh && test/smoke/run-smoke.sh autoheal:ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: End-to-end acceptance (the image, a real runner, the real Docker)
        env:
          E2E_IMAGE: autoheal:ci
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium --only-shell
          npm run test:e2e
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push amd64 and arm64
        id: push
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
          build-args: AUTOHEAL_IMAGE=${{ env.RUNNER_IMAGE }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
      - name: Scan exactly what was pushed, both platforms
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm -e TRIVY_USERNAME -e TRIVY_PASSWORD "$TRIVY_IMAGE" image --quiet --platform "$platform" \
              --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE@$DIGEST"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Digest, for pinning exactly what was scanned
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: echo "Pin with image ${IMAGE}@${{ steps.push.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
